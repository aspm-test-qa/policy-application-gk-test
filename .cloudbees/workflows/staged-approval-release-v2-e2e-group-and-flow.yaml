apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: staged-approval-release-v2
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
metadata:
  stages/v1alpha1:
    - name: Release Readiness
      jobs:
        - create-release-ticket
        - gather-evidence
        - quality-gate-check
        - update-jira-status
        - checkout-and-sast-scan
        - policy-check-release-readiness
        - approval
    - name: Quality Assurance
      jobs:
        - helm-deploy
        - unify-fm
        - playwright-e2e-tests
        - performance-tests
        - policy-check-qa
    - name: Staging
      jobs:
        - create-release
        - argocd-deploy
        - enable-beta-features
        - smoke-tests
        - rollback-check
        - policy-check-staging
    - name: Production
      jobs:
        - servicenow-approval
        - blue-green-deploy
        - prod-smoke-tests
        - gradual-feature-rollout
        - policy-check-production
jobs:
  create-release-ticket:
    steps:
      - run: echo "Creating release ticket"
        uses: docker://golang:1.26.3
        shell: sh
  gather-evidence:
    steps:
      - uses: docker://alpine:3.20
        run: echo "Gathering release evidence"
  quality-gate-check:
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running quality gate check"
  update-jira-status:
    steps:
      - uses: docker://alpine:3.20
        run: echo "Updating JIRA status"
  checkout-and-sast-scan:
    needs: update-jira-status
    outputs:
      policy-subject: ${{ steps.trivy-scan.outputs.policy-subject }}
      gitleaks-policy-subject: ${{ steps.gitleaks-step.outputs.policy-subject }}
    steps:
      - name: Checkout Component 1
        uses: cloudbees-io/checkout@v1
        with:
          provider: github
          repository: https://github.com/Dev-Org-Hari/webrtc-go
          ref: main
          path: webrtc-repo

      - name: Run Gitleaks Scan
        id: gitleaks-step
        uses: cloudbees-io/gitleaks-plugin@v1
        with:
          workspace-dir: webrtc-repo

      - name: Print Gitleaks Outputs
        uses: docker://alpine:latest
        run: |
          echo "=== Gitleaks Scan Results ==="
          echo "Critical: ${{ steps.gitleaks-step.outputs.critical-count }}"
          echo "Very High: ${{ steps.gitleaks-step.outputs.very-high-count }}"
          echo "High: ${{ steps.gitleaks-step.outputs.high-count }}"
          echo "Medium: ${{ steps.gitleaks-step.outputs.medium-count }}"
          echo "Low: ${{ steps.gitleaks-step.outputs.low-count }}"
          echo "Policy Subject: ${{ steps.gitleaks-step.outputs.policy-subject }}"

      - name: jfrog-actions-workflow-download
        uses: cloudbees-io/jfrog-artifactory-download-file@v1
        with:
          url: ${{ vars.PE_JFROG_URL }}
          username: ${{ vars.PE_JFROG_ACTIONS_USERNAME }}
          password: ${{ secrets.PE_JFROG_ACTIONS_PASSWORD }}
          file-path: /cloudbees/workspace/golang-alpine.tar
          artifactory-path: test-generic-repo/jfrogtest/golang-alpine.tar

      - name: Scan with Trivy
        id: trivy-scan
        uses: cloudbees-io/trivy-plugin@v1
        with:
          binary-tar-path: /cloudbees/workspace/golang-alpine.tar

      - name: Print Trivy Outputs
        uses: docker://alpine:latest
        run: |
          echo "=== Trivy Scan Results ==="
          echo "Critical: ${{ steps.trivy-scan.outputs.critical-count }}"
          echo "Very High: ${{ steps.trivy-scan.outputs.very-high-count }}"
          echo "High: ${{ steps.trivy-scan.outputs.high-count }}"
          echo "Medium: ${{ steps.trivy-scan.outputs.medium-count }}"
          echo "Low: ${{ steps.trivy-scan.outputs.low-count }}"
          echo "Policy Subject: ${{ steps.trivy-scan.outputs.policy-subject }}"

      - name: Print All Scan Summary
        uses: docker://alpine:latest
        run: |
          echo "======================================"
          echo "=== Scan Summary ==="
          echo "======================================"
          echo "--- Gitleaks ---"
          echo "Critical: ${{ steps.gitleaks-step.outputs.critical-count }} | High: ${{ steps.gitleaks-step.outputs.high-count }} | Medium: ${{ steps.gitleaks-step.outputs.medium-count }} | Low: ${{ steps.gitleaks-step.outputs.low-count }}"
          echo "--- Trivy ---"
          echo "Critical: ${{ steps.trivy-scan.outputs.critical-count }} | High: ${{ steps.trivy-scan.outputs.high-count }} | Medium: ${{ steps.trivy-scan.outputs.medium-count }} | Low: ${{ steps.trivy-scan.outputs.low-count }}"
          echo "======================================"

  policy-check-release-readiness:
    needs: checkout-and-sast-scan
    steps:
      - name: "P1 - group-critical-high (expect BLOCK: Group1 fails, Group2 passes)"
        id: p1-group-critical-high
        continue-on-error: true
        uses: cloudbees-io/policy-check@v1
        with:
          policy: 1a2b84d0-66d6-41d3-8188-89abbdbb6d9d
          input-data: ${{ needs.checkout-and-sast-scan.outputs.policy-subject }}

      - name: "P2 - group-high-medium (expect BLOCK: Group1 fails, Group2 passes)"
        id: p2-group-high-medium
        continue-on-error: true
        uses: cloudbees-io/policy-check@v1
        with:
          policy: 3e299efc-0169-4175-ad1f-27add0a873cf
          input-data: ${{ needs.checkout-and-sast-scan.outputs.policy-subject }}

      - name: "P3 - critical-AND-high (expect CONTINUE: high=11 > 10)"
        id: p3-critical-and-high
        continue-on-error: true
        uses: cloudbees-io/policy-check@v1
        with:
          policy: bfe73083-bf30-41d9-9651-218961f64c0f
          input-data: ${{ needs.checkout-and-sast-scan.outputs.policy-subject }}

      - name: "P4 - critical-AND-medium (expect BLOCK: critical=0, medium=19<=20)"
        id: p4-critical-and-medium
        continue-on-error: true
        uses: cloudbees-io/policy-check@v1
        with:
          policy: b52fa9bd-6585-44bb-b7c2-8347c9c6960a
          input-data: ${{ needs.checkout-and-sast-scan.outputs.policy-subject }}

      - name: "P5 - group-cross-severity (expect BLOCK: Group1 fails, Group2 passes)"
        id: p5-group-cross-severity
        continue-on-error: true
        uses: cloudbees-io/policy-check@v1
        with:
          policy: 37008eaf-1836-4b45-bda0-9127632d6c68
          input-data: ${{ needs.checkout-and-sast-scan.outputs.policy-subject }}

      - name: "P6 - all-severities-AND (expect CONTINUE: high=11 > 10 breaks AND)"
        id: p6-all-severities-and
        continue-on-error: true
        uses: cloudbees-io/policy-check@v1
        with:
          policy: 57aeb127-efa3-4c39-abab-3ae12c51975d
          input-data: ${{ needs.checkout-and-sast-scan.outputs.policy-subject }}

      - name: Print Policy Matrix Results
        uses: docker://alpine:latest
        run: |
          echo "============================================"
          echo "=== Policy Matrix Results Summary ==="
          echo "============================================"
          echo "P1 group-critical-high  [expect BLOCK] - see step result above"
          echo "P2 group-high-medium    [expect BLOCK] - see step result above"
          echo "P3 critical-AND-high    [expect CONTINUE] - see step result above"
          echo "P4 critical-AND-medium  [expect BLOCK] - see step result above"
          echo "P5 group-cross-severity [expect BLOCK] - see step result above"
          echo "P6 all-severities-AND   [expect CONTINUE] - see step result above"
          echo "============================================"

  approval:
    needs:
      - create-release-ticket
      - gather-evidence
      - quality-gate-check
      - update-jira-status
      - checkout-and-sast-scan
      - policy-check-release-readiness
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Approve release readiness to proceed to QA.
      disallowLaunchByUser: false
      approvers: release-managers
      notifyAllEligibleUsers: false

  helm-deploy:
    needs: approval
    steps:
      - uses: docker://alpine:3.20
        run: echo "Deploying via Helm to QA environment"
  unify-fm:
    needs: approval
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running Unify FM checks"
  playwright-e2e-tests:
    needs: approval
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running Playwright E2E tests"
  performance-tests:
    needs: approval
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running performance tests"
  policy-check-qa:
    needs:
      - helm-deploy
      - unify-fm
      - playwright-e2e-tests
      - performance-tests
    steps:
      - uses: docker://alpine:3.20
        run: echo "Evaluating policies - High CVE Notification (NOTIFY)"
  create-release:
    needs: policy-check-qa
    steps:
      - uses: docker://alpine:3.20
        run: echo "Creating release for staging"
  argocd-deploy:
    needs: create-release
    steps:
      - uses: docker://alpine:3.20
        run: echo "Deploying to staging via ArgoCD"
  enable-beta-features:
    needs: create-release
    steps:
      - uses: docker://alpine:3.20
        run: echo "Enabling beta features in staging"
  smoke-tests:
    needs:
      - argocd-deploy
      - enable-beta-features
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running smoke tests on staging"
  rollback-check:
    needs:
      - argocd-deploy
      - enable-beta-features
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running rollback check on staging"
  policy-check-staging:
    needs:
      - smoke-tests
      - rollback-check
    steps:
      - uses: docker://alpine:3.20
        run: echo "Evaluating policies - Production Readiness (PAUSE & NOTIFY)"
  servicenow-approval:
    needs: policy-check-staging
    steps:
      - uses: docker://alpine:3.20
        run: echo "ServiceNow approval submitted"
  blue-green-deploy:
    needs: servicenow-approval
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running blue-green deployment to production"
  prod-smoke-tests:
    needs: blue-green-deploy
    steps:
      - uses: docker://alpine:3.20
        run: echo "Running production smoke tests"
  gradual-feature-rollout:
    needs: blue-green-deploy
    steps:
      - uses: docker://alpine:3.20
        run: echo "Gradual feature rollout in production"
  policy-check-production:
    needs:
      - prod-smoke-tests
      - gradual-feature-rollout
    steps:
      - uses: docker://alpine:3.20
        run: echo "Evaluating policies - Production deployment complete"
